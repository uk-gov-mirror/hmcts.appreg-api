post:
  operationId: triggerCsdsIngress
  tags: [ admin ]
  summary: Trigger CSDS ingress on demand.
  description: >
    Runs all enabled CSDS ingress processors synchronously using the same retrieval and apply flow
    as the scheduled CSDS job. Processing continues if an individual processor fails, but the
    request returns an error after all processors have been attempted. If all failures are invalid
    record data returned by CSDS (including missing fields, invalid IDs and malformed dates), the
    response is `502 Bad Gateway`. Unexpected AppReg failures, including a mixture of upstream
    validation and internal failures, result in `500 Internal Server Error`. Successful processors'
    changes are not rolled back when another processor fails.
    The endpoint does not update the scheduled-run execution log and therefore does not
    suppress a subsequent scheduled run. Only callers with the admin role can trigger the operation.
  responses:
    "200":
      description: All enabled CSDS ingress processors completed successfully.
      headers:
        Vary:
          description: Response varies by Accept for media-type versioning.
          schema: { type: string }
          example: Accept
    "401": { $ref: "../../components/responses/unauthorized-error.yaml" }
    "403": { $ref: "../../components/responses/forbidden-error.yaml" }
    "423": { $ref: "../../components/responses/locked-error.yaml" }
    "500": { $ref: "../../components/responses/internal-server-error.yaml" }
    "502": { $ref: "../../components/responses/csds-upstream-bad-gateway-error.yaml" }
